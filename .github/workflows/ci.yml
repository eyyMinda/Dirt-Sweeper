name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build DirtSweeper.sln -c Release

      - name: Test
        run: dotnet test tests/DirtSweeper.Tests -c Release --no-build

      # the same packaging step as release.yml, so a broken release is caught on the PR, not on the tag
      - name: Package (as a release would)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/DirtSweeper/DirtSweeper.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          . ./scripts/common.ps1
          New-ReleaseFiles (Resolve-Path src/DirtSweeper/bin/Release/net48/DirtSweeper.exe).Path $version (Join-Path $PWD release)
          Get-ChildItem release | Format-Table Name, Length -AutoSize
          Get-Content release/SHA256SUMS.txt

      # the exe, zip and checksums of every build, for trying a branch without a release
      - uses: actions/upload-artifact@v4
        with:
          name: DirtSweeper-${{ github.sha }}
          path: release/*
